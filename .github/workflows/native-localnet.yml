name: Native validator

on:
  push:
    paths: ["protocol/**", "src/**", "Cargo.toml", "Cargo.lock", "spec.md", "build.rs", ".cargo/**", "rust-toolchain.toml", ".github/workflows/native-localnet.yml"]
  pull_request:
    paths: ["protocol/**", "src/**", "Cargo.toml", "Cargo.lock", "spec.md", "build.rs", ".cargo/**", "rust-toolchain.toml", ".github/workflows/native-localnet.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-validator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Check out source and engine baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install pinned SBF builder and current validator
        run: |
          rustup show active-toolchain
          cargo install cargo-build-sbf --version 4.6.0 --locked
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/agave.tar.bz2" https://github.com/anza-xyz/agave/releases/download/v4.4.1/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo "5b0f0fc7e4eedace05f6455de00aa1f2f3d1642068f1e8d50760ba49112c3941  $RUNNER_TEMP/agave.tar.bz2" | sha256sum --check
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/solana-release/bin/solana-test-validator" --version
      - name: Install locked client dependencies
        run: npm ci --prefix protocol --ignore-scripts --no-audit --no-fund
      - name: Fetch pinned wrapper
        run: |
          git init "$RUNNER_TEMP/percolator-prog"
          git -C "$RUNNER_TEMP/percolator-prog" remote add origin https://github.com/aeyakovenko/percolator-prog.git
          git -C "$RUNNER_TEMP/percolator-prog" fetch --depth 1 origin b42fe017c2bc953778f90d0cb85cd1d426b6e783
          git -C "$RUNNER_TEMP/percolator-prog" checkout --detach FETCH_HEAD
      - name: Bootstrap market and execute both trade directions through RPC
        run: |
          bash protocol/localnet/run.sh "$RUNNER_TEMP/percolator-prog" \
            --validator "$RUNNER_TEMP/solana-release/bin/solana-test-validator" \
            --state-dir "$RUNNER_TEMP/outright-localnet" --test
      - name: Show validator diagnostics on failure
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/outright-localnet/validator-output.log" "$RUNNER_TEMP/outright-localnet/ledger/validator.log"; do
            if [ -f "$log" ]; then tail -100 "$log"; fi
          done
