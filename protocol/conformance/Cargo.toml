[package]
name = "outright-protocol-conformance"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
percolator-prog = { git = "https://github.com/aeyakovenko/percolator-prog", rev = "357157e6e14d1d10ce78a995d5d50bb3c1f2ae13", features = ["no-entrypoint"] }
percolator = { path = "../.." }
serde_json = "1.0"
solana-program = "=1.18.26"
spl-token = { version = "=4.0.3", features = ["no-entrypoint"] }

[[bin]]
name = "export-contract"
path = "src/main.rs"

[patch."https://github.com/aeyakovenko/percolator"]
percolator = { path = "../.." }

# Keep host integration dependencies separate from the engine workspace.
[workspace]
