[package]
name = "outright-protocol-conformance"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
percolator-prog = { git = "https://github.com/TheTradoor/outright-program", rev = "72dd8948b116e9e16a85c830e1e2a7915f12d542", features = ["no-entrypoint"] }
percolator = { path = "../.." }
serde_json = "1.0"
solana-program = "=1.18.26"
spl-token = { version = "=4.0.3", features = ["no-entrypoint"] }

[[bin]]
name = "export-contract"
path = "src/main.rs"

[patch."https://github.com/aeyakovenko/percolator"]
percolator = { path = "../.." }

# Keep host integration dependencies separate from the engine workspace.
[workspace]
